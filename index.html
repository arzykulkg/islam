<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>İslam – Kitaplar, Dinle, Yazılar, Zikirmatik</title>
<meta name="description" content="İslami kitaplar, ses kayıtları, yazılar ve zikirmatik.">
<meta name="theme-color" content="#0f5c4a">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f6f1e4;--card:#fffdf7;--ink:#1d2b26;--mut:#6b756f;--g:#0f5c4a;--g2:#167a62;--gold:#c9a227;--line:#e5dcc3;--sh:0 6px 22px rgba(15,60,48,.10)}
:root[data-theme=dark]{--bg:#0e1a17;--card:#152722;--ink:#e9efe9;--mut:#9bb0a6;--g:#2fb08f;--g2:#3ccaa4;--gold:#e8c766;--line:#24403a;--sh:0 6px 22px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:env(safe-area-inset-top) 16px 0}
.hd{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;height:56px}
.logo{font:700 22px Amiri,serif;display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none}
.logo svg{width:30px;height:30px}
.sp{flex:1}.tm{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:7px 11px;font-size:16px;cursor:pointer}
nav{max-width:980px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav a{color:#d6efe7;text-decoration:none;padding:8px 14px;border-radius:999px;white-space:nowrap;font-weight:600;font-size:15px}
nav a.on{background:#fff;color:var(--g)}
main{max-width:980px;margin:0 auto;padding:20px 16px 90px}
h1{font:700 30px Amiri,serif;margin:6px 0 4px;color:var(--g)}h2{font-size:19px;margin:22px 0 10px}
.lead{color:var(--mut);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh)}
.tile{display:block;text-decoration:none;color:inherit;transition:transform .15s}.tile:hover{transform:translateY(-3px)}
.tile .ic{font-size:34px}.tile b{display:block;font-size:18px;margin:6px 0 2px}.tile span{color:var(--mut);font-size:14px}
.bk{display:flex;flex-direction:column;gap:6px}.bk .cv{height:120px;border-radius:12px;background:linear-gradient(135deg,var(--g),var(--g2));color:#e8c766;display:flex;align-items:center;justify-content:center;font:700 40px Amiri,serif}
.bk b{font-size:16px;line-height:1.3}.bk small{color:var(--mut)}
.btn{display:inline-block;border:0;border-radius:11px;background:var(--g);color:#fff;font:600 15px Inter,sans-serif;padding:10px 16px;cursor:pointer;text-decoration:none}
.btn.o{background:transparent;color:var(--g);border:1.5px solid var(--g)}.btn.g{background:var(--gold);color:#2a2100}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px;color:var(--ink)}.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
input[type=search],input[type=text],textarea,select{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:11px 14px;font:inherit}
.empty{text-align:center;color:var(--mut);padding:40px 10px;border:2px dashed var(--line);border-radius:16px}
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.ov .bar{background:var(--g);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.ov iframe{flex:1;border:0;width:100%;background:#fff}
.post h3{margin:0 0 4px;font-size:19px}.post .meta{color:var(--mut);font-size:13px;margin-bottom:8px}.post p{margin:0 0 10px;white-space:pre-line}
/* audio */
.trk{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;cursor:pointer}.trk:hover,.trk.on{background:color-mix(in srgb,var(--g) 10%,transparent)}
.trk .pl{width:40px;height:40px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.12);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.player .in{max-width:980px;margin:0 auto}.player audio{width:100%;height:38px}
/* zikir */
.zk{max-width:520px;margin:0 auto;text-align:center}
.zar{font:700 40px/1.5 Amiri,serif;color:var(--g);margin:4px 0}.ztr{color:var(--mut);margin:0 0 8px}
.zbig{width:min(70vw,280px);height:min(70vw,280px);border-radius:50%;border:0;margin:14px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,var(--g2),var(--g));color:#fff;box-shadow:0 14px 40px rgba(15,92,74,.45),inset 0 -8px 20px rgba(0,0,0,.2);cursor:pointer;user-select:none;touch-action:manipulation;transition:transform .06s}
.zbig:active{transform:scale(.96)}.zbig .n{font:700 78px/1 Inter,sans-serif}.zbig .t{opacity:.85;margin-top:6px}
.ring{width:100%;height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 14px}.ring i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--g2));width:0;transition:width .15s}
.zl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.zs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}.zs .card{padding:10px 16px;min-width:110px}.zs b{font-size:22px;display:block}.zs span{font-size:12px;color:var(--mut)}
.pulse{animation:pu .6s}@keyframes pu{0%{box-shadow:0 0 0 0 rgba(201,162,39,.8)}100%{box-shadow:0 0 0 40px rgba(201,162,39,0)}}
footer{text-align:center;color:var(--mut);font-size:13px;padding:30px 16px 110px}
</style></head><body>
<header><div class="hd"><a class="logo" href="#/"><svg viewBox="0 0 100 100"><path d="M62 24a28 28 0 1 0 0 52 22 22 0 1 1 0-52z" fill="#e8c766"/><path d="M70 30l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#e8c766"/></svg>İslam</a><span class="sp"></span><button class="tm" id="tm" title="Tema">🌙</button></div>
<nav id="nav"><a href="#/" data-r="">Ana sayfa</a><a href="#/kitaplar" data-r="kitaplar">📚 Kitaplar</a><a href="#/dinle" data-r="dinle">🎧 Dinle</a><a href="#/yazilar" data-r="yazilar">✍️ Yazılar</a><a href="#/zikirmatik" data-r="zikirmatik">📿 Zikirmatik</a></nav></header>
<main id="app"></main>
<footer>Allah kabul etsin · <span id="yr"></span></footer>
<div class="player" id="pl" hidden><div class="in"><div class="row" style="justify-content:space-between;margin-bottom:4px"><b id="pt" style="font-size:14px"></b><span class="row"><select id="ps" style="width:auto;padding:4px 8px"><option value=".75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><button class="chip" id="pn">⏭</button><button class="chip" id="px">✕</button></span></div><audio id="au" controls preload="none"></audio></div></div>
<script>
"use strict";
var $=function(s,r){return(r||document).querySelector(s)};
function h(t,a,c){var e=document.createElement(t);if(a)for(var k in a){if(k==='class')e.className=a[k];else if(k==='html')e.innerHTML=a[k];else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k])}
 [].concat(c==null?[]:c).forEach(function(x){e.append(x&&x.nodeType?x:document.createTextNode(x))});return e}
function ls(k,v){try{if(v===undefined){var r=localStorage.getItem(k);return r==null?null:JSON.parse(r)}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
$('#yr').textContent=new Date().getFullYear();
/* theme */
var th=ls('th')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
function setTh(t){th=t;document.documentElement.dataset.theme=t;$('#tm').textContent=t==='dark'?'☀️':'🌙';ls('th',t)}setTh(th);$('#tm').onclick=function(){setTh(th==='dark'?'light':'dark')};
var app=$('#app'),DATA={};
function load(n){if(DATA[n])return Promise.resolve(DATA[n]);return fetch('data/'+n+'.json?v='+Date.now()).then(function(r){return r.json()}).catch(function(){return[]}).then(function(d){return DATA[n]=d})}
/* ---------- home ---------- */
function home(){app.innerHTML='';
 app.append(h('h1',null,'Bismillâhirrahmânirrahîm'),h('p',{class:'lead'},'Kitap oku, dinle, yazıları takip et ve zikret.'));
 var g=h('div',{class:'grid'});
 [['📚','Kitaplar','Sitede oku, istersen indir','#/kitaplar'],['🎧','Dinle','Ses kayıtları, hız ayarı, kaldığın yerden devam','#/dinle'],['✍️','Yazılar','Makaleler ve notlar · kendi notlarını da tut','#/yazilar'],['📿','Zikirmatik','Hazır zikirler, hedef, titreşim','#/zikirmatik']].forEach(function(x){
  g.append(h('a',{class:'card tile',href:x[3]},[h('div',{class:'ic'},x[0]),h('b',null,x[1]),h('span',null,x[2])]))});
 app.append(g);
 load('posts').then(function(P){if(!P.length)return;app.append(h('h2',null,'Son yazılar'));P.slice().sort(function(a,b){return a.date<b.date?1:-1}).slice(0,3).forEach(function(p){app.append(postCard(p))})})}
/* ---------- books ---------- */
function openPdf(b){var ov=h('div',{class:'ov'},[h('div',{class:'bar'},[h('button',{class:'btn o',style:'color:#fff;border-color:#fff',onclick:function(){ov.remove()}},'← Geri'),h('b',{style:'flex:1;font-size:15px'},b.t),h('a',{class:'btn g',href:b.file,download:''},'⬇ İndir')]),h('iframe',{src:b.file})]);document.body.append(ov)}
function books(){app.innerHTML='';app.append(h('h1',null,'Kitaplar'),h('p',{class:'lead'},'Kitabı seç, sitede oku veya indir.'));
 var q=h('input',{type:'search',placeholder:'Kitap veya yazar ara…'}),chips=h('div',{class:'chips'}),list=h('div',{class:'grid'});app.append(q,h('div',{style:'height:12px'}),chips,list);
 load('books').then(function(B){var cat='';
  if(!B.length){list.replaceWith(h('div',{class:'empty'},'Henüz kitap eklenmedi. Yakında burada olacak.'));return}
  var cats=['Tümü'].concat(B.map(function(b){return b.cat||'Diğer'}).filter(function(c,i,a){return a.indexOf(c)===i}));
  function draw(){list.innerHTML='';chips.innerHTML='';cats.forEach(function(c){chips.append(h('span',{class:'chip'+((cat||'Tümü')===c?' on':''),onclick:function(){cat=c==='Tümü'?'':c;draw()}},c))});
   var s=q.value.toLowerCase();B.filter(function(b){return(!cat||(b.cat||'Diğer')===cat)&&(!s||(b.t+' '+(b.a||'')).toLowerCase().indexOf(s)>=0)}).forEach(function(b){
    list.append(h('div',{class:'card bk'},[h('div',{class:'cv'},(b.t||'؟').charAt(0)),h('b',null,b.t),h('small',null,b.a||''),h('div',{class:'row'},[h('button',{class:'btn',onclick:function(){openPdf(b)}},'📖 Oku'),h('a',{class:'btn o',href:b.file,download:''},'⬇')])]))})}
  q.oninput=draw;draw()})}
/* ---------- audio ---------- */
var au=$('#au'),Q=[],qi=-1;
function play(i){var a=Q[i];if(!a)return;qi=i;au.src=a.file;$('#pt').textContent=a.t;$('#pl').hidden=false;au.playbackRate=+$('#ps').value;var pos=(ls('pos')||{})[a.file];au.onloadedmetadata=function(){if(pos&&pos<au.duration-5)au.currentTime=pos;au.playbackRate=+$('#ps').value};au.play().catch(function(){});document.querySelectorAll('.trk').forEach(function(e){e.classList.toggle('on',+e.dataset.i===i)})}
au.addEventListener('timeupdate',function(){if(qi<0)return;var p=ls('pos')||{};p[Q[qi].file]=au.currentTime;ls('pos',p)});
au.addEventListener('ended',function(){var p=ls('pos')||{};delete p[Q[qi].file];ls('pos',p);if(Q[qi+1])play(qi+1)});
$('#ps').onchange=function(){au.playbackRate=+this.value};$('#pn').onclick=function(){if(Q[qi+1])play(qi+1)};$('#px').onclick=function(){au.pause();$('#pl').hidden=true;qi=-1};
function listen(){app.innerHTML='';app.append(h('h1',null,'Dinle'),h('p',{class:'lead'},'Dinlemeye başla, kaldığın yerden devam eder.'));
 var box=h('div',{class:'card'});app.append(box);
 load('audio').then(function(A){if(!A.length){box.replaceWith(h('div',{class:'empty'},'Henüz ses kaydı eklenmedi. Yakında burada olacak.'));return}
  Q=A;A.forEach(function(a,i){box.append(h('div',{class:'trk'+(i===qi?' on':''),'data-i':i,onclick:function(){play(i)}},[h('div',{class:'pl'},'▶'),h('div',null,[h('b',null,a.t),h('div',{style:'color:var(--mut);font-size:13px'},[a.a||'',a.cat?' · '+a.cat:''].join(''))])]))})})}
/* ---------- posts ---------- */
function postCard(p){return h('div',{class:'card post',style:'margin-bottom:12px'},[h('h3',null,p.t),h('div',{class:'meta'},[p.date,p.cat?' · '+p.cat:''].join('')),h('div',{html:esc(p.body).split(/\n\n+/).map(function(x){return'<p>'+x+'</p>'}).join('')})])}
function posts(){app.innerHTML='';app.append(h('h1',null,'Yazılar'),h('p',{class:'lead'},'Makaleler, dualar ve notlar.'));
 var tabs=h('div',{class:'chips'}),body=h('div');app.append(tabs,body);var tab='y';
 function draw(){tabs.innerHTML='';[['y','Yazılar'],['n','🗒 Notlarım']].forEach(function(t){tabs.append(h('span',{class:'chip'+(tab===t[0]?' on':''),onclick:function(){tab=t[0];draw()}},t[1]))});body.innerHTML='';
  if(tab==='y')load('posts').then(function(P){if(!P.length)body.append(h('div',{class:'empty'},'Henüz yazı yok.'));P.slice().sort(function(a,b){return a.date<b.date?1:-1}).forEach(function(p){body.append(postCard(p))})});
  else notes(body)}
 draw()}
function notes(box){var N=ls('notes')||[];
 box.append(h('p',{class:'lead'},'Notların yalnızca bu cihazda saklanır, kimse görmez.'));
 var ta=h('textarea',{rows:'4',placeholder:'Not yaz…'}),list=h('div',{style:'margin-top:14px'});
 box.append(ta,h('div',{style:'margin-top:8px'},h('button',{class:'btn',onclick:function(){var v=ta.value.trim();if(!v)return;N.unshift({t:v,d:new Date().toLocaleString('tr-TR')});ls('notes',N);ta.value='';draw()}},'Kaydet')),list);
 function draw(){list.innerHTML='';if(!N.length)list.append(h('div',{class:'empty'},'Henüz not yok.'));N.forEach(function(n,i){list.append(h('div',{class:'card',style:'margin-bottom:10px'},[h('div',{style:'white-space:pre-wrap'},n.t),h('div',{class:'row',style:'justify-content:space-between;margin-top:8px'},[h('small',{style:'color:var(--mut)'},n.d),h('button',{class:'chip',onclick:function(){if(confirm('Silinsin mi?')){N.splice(i,1);ls('notes',N);draw()}}},'Sil')])]))})}draw()}
/* ---------- zikirmatik ---------- */
var ZK=[
 {id:'sub',ar:'سُبْحَانَ اللّٰه',tr:'Sübhânallah',t:33},
 {id:'hmd',ar:'اَلْحَمْدُ لِلّٰه',tr:'Elhamdülillâh',t:33},
 {id:'ekb',ar:'اَللّٰهُ أَكْبَر',tr:'Allâhu ekber',t:34},
 {id:'ist',ar:'أَسْتَغْفِرُ اللّٰه',tr:'Estağfirullâh',t:100},
 {id:'lel',ar:'لَا إِلٰهَ إِلَّا اللّٰه',tr:'Lâ ilâhe illallâh',t:100},
 {id:'sal',ar:'اَللّٰهُمَّ صَلِّ عَلٰى سَيِّدِنَا مُحَمَّد',tr:'Salavât-ı şerîfe',t:100},
 {id:'hql',ar:'لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللّٰه',tr:'Lâ havle velâ kuvvete illâ billâh',t:100},
 {id:'cus',ar:'',tr:'Serbest sayaç',t:0}
];
function zikir(){app.innerHTML='';var S=ls('zk')||{cur:'sub',c:{},tg:{},tot:{},vib:1};
 var today=new Date().toISOString().slice(0,10);if(S.day!==today){S.day=today;S.today=0}
 var wrap=h('div',{class:'zk'});app.append(h('h1',null,'Zikirmatik'),h('p',{class:'lead'},'Dokun ve say. Sayacın bu cihazda saklanır.'),wrap);
 function save(){ls('zk',S)}
 function cur(){return ZK.filter(function(z){return z.id===S.cur})[0]}
 function tgt(){var z=cur();return S.tg[z.id]!=null?S.tg[z.id]:z.t}
 function draw(){wrap.innerHTML='';var z=cur(),n=S.c[z.id]||0,T=tgt();
  var lst=h('div',{class:'zl'});ZK.forEach(function(x){lst.append(h('span',{class:'chip'+(x.id===S.cur?' on':''),onclick:function(){S.cur=x.id;save();draw()}},x.tr.split(' ')[0]==='Serbest'?'Serbest':x.tr))});
  var big=h('button',{class:'zbig',id:'zb','aria-label':'Say'},[h('div',{class:'n'},String(n)),h('div',{class:'t'},T?'/ '+T:'dokun')]);
  var ring=h('div',{class:'ring'},h('i'));ring.firstChild.style.width=T?Math.min(100,n/T*100)+'%':'0';
  function tick(){n=(S.c[z.id]||0)+1;S.c[z.id]=n;S.tot[z.id]=(S.tot[z.id]||0)+1;S.today=(S.today||0)+1;save();
   big.firstChild.textContent=n;ring.firstChild.style.width=T?Math.min(100,n/T*100)+'%':'0';tt.textContent=S.today;tl.textContent=S.tot[z.id]||0;
   if(S.vib&&navigator.vibrate)navigator.vibrate(T&&n%T===0?[80,60,80]:12);
   if(T&&n%T===0){big.classList.remove('pulse');void big.offsetWidth;big.classList.add('pulse')}}
  big.addEventListener('click',tick);
  var tt=h('b',null,String(S.today||0)),tl=h('b',null,String(S.tot[z.id]||0));
  wrap.append(lst,z.ar?h('div',{class:'zar'},z.ar):'',h('div',{class:'ztr'},z.tr),big,ring,
   h('div',{class:'row',style:'justify-content:center'},[
    h('button',{class:'btn o',onclick:function(){if((S.c[z.id]||0)>0){S.c[z.id]--;S.tot[z.id]=Math.max(0,(S.tot[z.id]||0)-1);S.today=Math.max(0,(S.today||0)-1);save();draw()}}},'↶ Geri al'),
    h('button',{class:'btn o',onclick:function(){S.c[z.id]=0;save();draw()}},'↺ Sıfırla'),
    h('button',{class:'btn o',onclick:function(){var v=prompt('Hedef sayı (0 = hedefsiz):',T);if(v===null)return;v=Math.max(0,parseInt(v)||0);S.tg[z.id]=v;save();draw()}},'🎯 Hedef'),
    h('button',{class:'btn o',onclick:function(){S.vib=S.vib?0:1;save();draw()}},S.vib?'📳 Titreşim açık':'📴 Titreşim kapalı')]),
   h('div',{class:'zs'},[h('div',{class:'card'},[tt,h('span',null,'Bugün (toplam)')]),h('div',{class:'card'},[tl,h('span',null,'Bu zikirde toplam')])]))}
 draw()}
/* ---------- router ---------- */
var R={'':home,kitaplar:books,dinle:listen,yazilar:posts,zikirmatik:zikir};
function route(){var r=(location.hash.replace(/^#\/?/,'')||'').split('/')[0];(R[r]||home)();document.querySelectorAll('#nav a').forEach(function(a){a.classList.toggle('on',a.dataset.r===(R[r]?r:''))});window.scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script></body></html>
