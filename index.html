header{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:env(safe-area-inset-top) 16px 0}
.hd{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;height:56px}
.logo{font:700 22px Amiri,serif;display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none}
.logo svg{width:30px;height:30px}
.sp{flex:1}.tm{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:7px 11px;font-size:15px;font-weight:600;cursor:pointer}.tm+.tm{margin-left:4px}
nav{max-width:980px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}

nav a.on{background:#fff;color:var(--g)}
main{max-width:980px;margin:0 auto;padding:20px 16px 90px}
h1{font:700 30px Amiri,serif;margin:6px 0 4px;color:var(--g)}h2{font-size:19px;margin:22px 0 10px}
.lead{color:var(--mut);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh)}
.tile{display:block;text-decoration:none;color:inherit;transition:transform .15s}.tile:hover{transform:translateY(-3px)}
.tile .ic{font-size:34px}.tile b{display:block;font-size:18px;margin:6px 0 2px}.tile span{color:var(--mut);font-size:14px}
.bk{display:flex;flex-direction:column;gap:6px}.bk .cv{height:120px;border-radius:12px;background:linear-gradient(135deg,var(--g),var(--g2));color:#e8c766;display:flex;align-items:center;justify-content:center;font:700 40px Amiri,serif}
.bk b{font-size:16px;line-height:1.3}.bk small{color:var(--mut)}
.btn{display:inline-block;border:0;border-radius:11px;background:var(--g);color:#fff;font:600 15px Inter,sans-serif;padding:10px 16px;cursor:pointer;text-decoration:none}
.btn.o{background:transparent;color:var(--g);border:1.5px solid var(--g)}.btn.g{background:var(--gold);color:#2a2100}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px;color:var(--ink)}.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
input[type=search],input[type=text],textarea,select{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:11px 14px;font:inherit}
.empty{text-align:center;color:var(--mut);padding:40px 10px;border:2px dashed var(--line);border-radius:16px}
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.ov .bar{background:var(--g);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.ov iframe{flex:1;border:0;width:100%;background:#fff}
.post h3{margin:0 0 4px;font-size:19px}.post .meta{color:var(--mut);font-size:13px;margin-bottom:8px}.post p{margin:0 0 10px;white-space:pre-line}

.trk{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;cursor:pointer}.trk:hover,.trk.on{background:color-mix(in srgb,var(--g) 10%,transparent)}
.trk .pl{width:40px;height:40px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.12);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.player .in{max-width:980px;margin:0 auto}.player audio{width:100%;height:38px}

.zar{font:700 40px/1.5 Amiri,serif;color:var(--g);margin:4px 0}.ztr{color:var(--mut);margin:0 0 8px}

.zbig:active{transform:scale(.96)}.zbig .n{font:700 78px/1 Inter,sans-serif}.zbig .t{opacity:.85;margin-top:6px}
.ring{width:100%;height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 14px}.ring i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--g2));width:0;transition:width .15s}
.zl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.zs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}.zs .card{padding:10px 16px;min-width:110px}.zs b{font-size:22px;display:block}.zs span{font-size:12px;color:var(--mut)}
.pulse{animation:pu .6s}@keyframes pu{0%{box-shadow:0 0 0 0 rgba(201,162,39,.8)}100%{box-shadow:0 0 0 40px rgba(201,162,39,0)}}

.ar{font:400 30px/2.1 Amiri,'Traditional Arabic',serif;direction:rtl;text-align:right;color:var(--ink);margin:0}
.ar.sm{font-size:25px}.vtr{color:var(--mut);margin:4px 0 0}.vn{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border-radius:50%;background:var(--g);color:#fff;font:600 13px Inter;margin-right:8px;flex:none}
.ay{padding:14px 4px;border-bottom:1px solid var(--line)}.ay .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.bism{text-align:center;font:400 30px/2 Amiri,serif;color:var(--g);margin:10px 0 4px}
.sl{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;cursor:pointer;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--card)}.sl:hover{border-color:var(--g)}
.sl .no{width:38px;height:38px;border-radius:10px;background:color-mix(in srgb,var(--g) 14%,transparent);color:var(--g);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}.sl b{display:block}.sl small{color:var(--mut)}
